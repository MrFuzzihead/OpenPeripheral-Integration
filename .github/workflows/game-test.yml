name: In-game integration tests

on:
  workflow_dispatch:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  game-test:
    name: Dedicated server game test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Accept EULA
        run: |
          mkdir -p run/server
          echo "eula=true" > run/server/eula.txt

      - name: Run in-game game tests (adapters + real ComputerCraft Lua)
        run: |
          set -o pipefail
          timeout 900 ./gradlew gameTestServer --console=plain --no-configuration-cache 2>&1 | tee game-test.log

      - name: Check game-test markers
        if: always()
        run: |
          grep -q "GAMETEST_INT_ADAPTERS_OK" game-test.log
          grep -q "GAMETEST_INT_LUA_OK" game-test.log
          grep -q "OPENPERIPHERAL_INTEGRATION_GAMETEST_OK" game-test.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-test-log
          path: game-test.log
          if-no-files-found: ignore
